name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - id: version
        name: Verify tag and package versions
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be a semantic version such as v1.0.0" >&2
            exit 1
          fi
          node scripts/check-versions.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: ./scripts/test-all.sh

  publish-npm:
    name: Publish npm packages
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish missing npm packages
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          publish_package() {
            local directory="$1"
            local package="$2"
            if npm view "$package@$VERSION" version >/dev/null 2>&1; then
              echo "$package@$VERSION is already published; skipping"
              return
            fi
            npm ci --prefix "$directory" --no-audit --no-fund
            (cd "$directory" && npm publish --access public)
          }
          publish_package server-node @baziness/server
          publish_package web @baziness/web

  github-release:
    name: Publish GitHub and Unity release
    needs: [verify, publish-npm]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Build release artifacts
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-artifacts
          npm ci --prefix server-node --no-audit --no-fund
          npm run build --prefix server-node
          npm pack ./server-node --pack-destination release-artifacts
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
          npm pack ./web --pack-destination release-artifacts
          npm pack ./unity/com.baziness.sdk --pack-destination release-artifacts
          ./server-java/build.sh --no-test
          cp "server-java/out/baziness-server-$VERSION.jar" release-artifacts/
          (cd release-artifacts && sha256sum * > SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Baziness SDK $VERSION" \
            --generate-notes
