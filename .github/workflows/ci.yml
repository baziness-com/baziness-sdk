name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/check-versions.mjs

  node-server:
    name: Node server SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-node
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server-node/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  java-server:
    name: Java server SDK JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: ./build.sh
        working-directory: server-java

  web:
    name: Web SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  unity-core:
    name: Unity core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: ./run-tests.sh
        working-directory: unity/tests/Baziness.Core.Tests
